<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Mini Redis architecture">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1e293b; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .flow { stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
    .ptr { stroke-dasharray: 6 5; animation: dash 1.6s linear infinite; }
    .glow { animation: glow 3s ease-in-out infinite; }
    .g2 { animation-delay: 1s; } .g3 { animation-delay: 2s; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect width="1000" height="540" rx="20" fill="#f8fafc"/>
  <text x="500" y="38" font-size="22" font-weight="800" text-anchor="middle">한눈에 보는 구조: 3개의 자료구조가 한 팀으로 일한다</text>

  <!-- CLI -->
  <rect x="30" y="200" width="150" height="120" rx="14" fill="#0f172a"/>
  <text x="105" y="232" font-size="15" font-weight="700" text-anchor="middle" style="fill:#e2e8f0">CLI (main.py)</text>
  <text x="105" y="260" font-size="13" class="mono" text-anchor="middle" style="fill:#7dd3fc">SET / GET / DEL</text>
  <text x="105" y="280" font-size="13" class="mono" text-anchor="middle" style="fill:#86efac">EXPIRE / TTL</text>
  <text x="105" y="300" font-size="13" class="mono" text-anchor="middle" style="fill:#fcd34d">INFO / CONFIG</text>
  <line class="flow" x1="182" y1="260" x2="236" y2="260" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Engine -->
  <rect x="240" y="150" width="190" height="220" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="335" y="184" font-size="17" font-weight="800" text-anchor="middle" style="fill:#3730a3">MiniRedis 엔진</text>
  <text x="335" y="210" font-size="12.5" text-anchor="middle" style="fill:#4338ca">(mini_redis.py)</text>
  <text x="335" y="248" font-size="13" text-anchor="middle">1. 만료 키 먼저 정리</text>
  <text x="335" y="272" font-size="13" text-anchor="middle">2. 메모리(바이트) 계산</text>
  <text x="335" y="296" font-size="13" text-anchor="middle">3. LRU 순서 갱신</text>
  <text x="335" y="320" font-size="13" text-anchor="middle">4. 초과 시 오래된 키 퇴거</text>
  <text x="335" y="350" font-size="12.5" font-weight="700" text-anchor="middle" style="fill:#4338ca">used_memory · evicted_keys</text>

  <!-- arrows to structures -->
  <line class="flow" x1="432" y1="215" x2="528" y2="120" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
  <line class="flow" x1="432" y1="260" x2="528" y2="300" stroke="#10b981" stroke-width="3" marker-end="url(#arr)"/>
  <line class="flow" x1="432" y1="310" x2="528" y2="450" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- HashMap -->
  <rect x="530" y="62" width="440" height="120" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="550" y="90" font-size="16" font-weight="800" style="fill:#1d4ed8">HashMap  <tspan font-weight="500" font-size="13">key → Record (hash_map.py)</tspan></text>
  <g class="mono" font-size="12">
    <rect x="550" y="104" width="36" height="30" rx="5" fill="#fff" stroke="#93c5fd"/><text x="568" y="124" text-anchor="middle">0</text>
    <rect x="590" y="104" width="36" height="30" rx="5" fill="#bfdbfe" stroke="#60a5fa"/><text x="608" y="124" text-anchor="middle">1</text>
    <rect x="630" y="104" width="36" height="30" rx="5" fill="#fff" stroke="#93c5fd"/><text x="648" y="124" text-anchor="middle">2</text>
    <rect x="670" y="104" width="36" height="30" rx="5" fill="#bfdbfe" stroke="#60a5fa"/><text x="688" y="124" text-anchor="middle">3</text>
    <rect x="710" y="104" width="36" height="30" rx="5" fill="#fff" stroke="#93c5fd"/><text x="728" y="124" text-anchor="middle">…</text>
  </g>
  <text x="768" y="118" font-size="12.5">체이닝: 같은 칸이면 리스트로 연결</text>
  <text x="768" y="136" font-size="12.5">로드팩터 &gt; 0.75 → 버킷 2배</text>
  <text x="550" y="162" font-size="12.5" style="fill:#1e40af">Record = { value, lru_node ⟶, expire_at }</text>

  <!-- LRU -->
  <rect x="530" y="232" width="440" height="140" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/>
  <text x="550" y="260" font-size="16" font-weight="800" style="fill:#047857">DoublyLinkedList  <tspan font-weight="500" font-size="13">LRU 순서 (doubly_linked_list.py)</tspan></text>
  <g class="mono" font-size="12.5">
    <rect x="550" y="282" width="62" height="34" rx="8" fill="#a7f3d0" stroke="#34d399"/><text x="581" y="304" text-anchor="middle">head</text>
    <rect x="644" y="282" width="78" height="34" rx="8" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="683" y="304" text-anchor="middle">user:3</text>
    <rect x="754" y="282" width="78" height="34" rx="8" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="793" y="304" text-anchor="middle">user:2</text>
    <rect x="864" y="282" width="62" height="34" rx="8" fill="#a7f3d0" stroke="#34d399"/><text x="895" y="304" text-anchor="middle">tail</text>
  </g>
  <g stroke="#059669" stroke-width="2" fill="none">
    <path d="M613,293 L642,293"/><path d="M723,293 L752,293"/><path d="M833,293 L862,293"/>
    <path d="M642,306 L613,306"/><path d="M752,306 L723,306"/><path d="M862,306 L833,306"/>
  </g>
  <text x="683" y="338" font-size="12" text-anchor="middle" font-weight="700" style="fill:#047857">▲ 최근 사용 (MRU)</text>
  <text x="793" y="354" font-size="12" text-anchor="middle" font-weight="700" style="fill:#b45309">▲ 가장 오래됨 → 퇴거 1순위</text>

  <!-- Heap -->
  <rect x="530" y="420" width="440" height="100" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="550" y="448" font-size="16" font-weight="800" style="fill:#b45309">MinHeap  <tspan font-weight="500" font-size="13">TTL 만료 (min_heap.py)</tspan></text>
  <g class="mono" font-size="12">
    <circle class="glow" cx="640" cy="488" r="17" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><text x="640" y="492" text-anchor="middle" font-weight="700">t=3</text>
    <circle cx="720" cy="495" r="15" fill="#fff" stroke="#f59e0b"/><text x="720" y="499" text-anchor="middle">t=8</text>
    <circle cx="790" cy="495" r="15" fill="#fff" stroke="#f59e0b"/><text x="790" y="499" text-anchor="middle">t=5</text>
  </g>
  <line x1="652" y1="498" x2="706" y2="498" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="652" y1="492" x2="776" y2="492" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="830" y="478" font-size="12.5">루트 = 가장 빨리 만료</text>
  <text x="830" y="498" font-size="12.5">peek() → O(1)</text>

  <!-- Record pointer -->
  <path class="ptr" d="M900,152 C990,200 990,230 930,286" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="975" y="205" font-size="12" font-weight="700" text-anchor="end" style="fill:#7c3aed">Record.lru_node</text>
  <text x="975" y="221" font-size="12" text-anchor="end" style="fill:#7c3aed">→ O(1) 위치 찾기</text>
</svg>
