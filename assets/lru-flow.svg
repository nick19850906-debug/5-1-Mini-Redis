<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="LRU eviction animation">
  <style>
    text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1e293b; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .f { opacity: 0; animation: show 16s infinite; }
    .f1 { animation-delay: 0s; } .f2 { animation-delay: 4s; } .f3 { animation-delay: 8s; } .f4 { animation-delay: 12s; }
    @keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 24% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
    .tab { animation: tabGlow 16s infinite; opacity: .45; }
    .t1 { animation-delay: 0s; } .t2 { animation-delay: 4s; } .t3 { animation-delay: 8s; } .t4 { animation-delay: 12s; }
    @keyframes tabGlow { 0% { opacity: .45; } 3%,24% { opacity: 1; } 27%,100% { opacity: .45; } }
    .bar1 { animation: b1 16s infinite; }
    @keyframes b1 { 0%,24% { width: 200px; fill: #38bdf8; } 25%,49% { width: 330px; fill: #ef4444; } 50%,74% { width: 220px; fill: #10b981; } 75%,100% { width: 220px; fill: #10b981; } }
    .over { animation: ov 16s infinite; }
    @keyframes ov { 0%,24% { opacity: 0; } 27%,49% { opacity: 1; } 52%,100% { opacity: 0; } }
    .dots circle { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .f, .tab, .bar1, .over, .dots circle { animation: none !important; opacity: 1 !important; } }
  </style>
  <rect width="1000" height="470" rx="20" fill="#f8fafc"/>
  <text x="500" y="34" font-size="21" font-weight="800" text-anchor="middle">LRU 퇴거 시나리오 (maxmemory = 30 bytes)</text>

  <!-- Synchronized 4-Step Timeline Bar -->
  <g font-size="12" font-weight="800" text-anchor="middle">
    <g class="tab t1"><rect x="40" y="50" width="215" height="30" rx="15" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><text x="147" y="70" style="fill:#0369a1">① 20B 정상 (u2 ⇄ u1)</text></g>
    <text x="267" y="70" style="fill:#94a3b8">➔</text>
    <g class="tab t2"><rect x="278" y="50" width="215" height="30" rx="15" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/><text x="385" y="70" style="fill:#b91c1c">② +13B → 33B 초과!</text></g>
    <text x="505" y="70" style="fill:#94a3b8">➔</text>
    <g class="tab t3"><rect x="516" y="50" width="215" height="30" rx="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="623" y="70" style="fill:#b45309">③ 맨 뒤 user:1 퇴거</text></g>
    <text x="743" y="70" style="fill:#94a3b8">➔</text>
    <g class="tab t4"><rect x="754" y="50" width="206" height="30" rx="15" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/><text x="857" y="70" style="fill:#065f46">④ 22B 안정 (evict=1)</text></g>
  </g>

  <!-- memory gauge -->
  <text x="40" y="114" font-size="14" font-weight="700">메모리 게이지</text>
  <rect x="40" y="124" width="450" height="26" rx="13" fill="#e2e8f0"/>
  <rect class="bar1" x="40" y="124" width="200" height="26" rx="13" fill="#38bdf8"/>
  <line x1="340" y1="116" x2="340" y2="158" stroke="#ef4444" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="340" y="176" font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#dc2626">maxmemory 30B</text>
  <text x="515" y="143" font-size="14" font-weight="800" class="over" style="fill:#dc2626">⚠️ 33B &gt; 30B 초과! 가장 오래된 꼬리 칸 퇴거 시작</text>

  <!-- list area -->
  <text x="40" y="218" font-size="14" font-weight="700">양손 기차 줄 (HEAD ⇄ 최신 1등석 MRU ⇄ … ⇄ 퇴거 1순위 LRU ⇄ TAIL)</text>
  <rect x="40" y="258" width="54" height="58" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="67" y="292" font-size="11.5" font-weight="800" text-anchor="middle" class="mono">HEAD</text>
  <rect x="906" y="258" width="54" height="58" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="933" y="292" font-size="11.5" font-weight="800" text-anchor="middle" class="mono">TAIL</text>

  <!-- frame 1 -->
  <g class="f f1">
    <text x="108" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="132" y="250" width="224" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="244" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="244" y="305" font-size="12.5" text-anchor="middle">9 bytes (MRU)</text>
    <text x="366" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="390" y="250" width="224" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="502" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:1 "Alice"</text>
    <text x="502" y="305" font-size="12.5" text-anchor="middle">11 bytes (LRU)</text>
    <text x="500" y="366" font-size="17" font-weight="800" text-anchor="middle" style="fill:#0369a1">① SET user:1, SET user:2 → used_memory = 20B</text>
    <text x="500" y="394" font-size="14" text-anchor="middle">아직 30B 이하라서 여유가 있습니다.</text>
  </g>
  <!-- frame 2 -->
  <g class="f f2">
    <text x="108" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="132" y="250" width="224" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="244" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:3 "Charlie"</text>
    <text x="244" y="305" font-size="12.5" text-anchor="middle">13 bytes (새 1등석!)</text>
    <text x="366" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="390" y="250" width="224" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="502" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="502" y="305" font-size="12.5" text-anchor="middle">9 bytes</text>
    <text x="624" y="293" font-size="16" font-weight="900" style="fill:#ef4444">⇄</text>
    <rect x="648" y="250" width="224" height="72" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="760" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:1 "Alice"</text>
    <text x="760" y="305" font-size="12.5" text-anchor="middle">11 bytes (퇴거 후보!)</text>
    <text x="880" y="293" font-size="16" font-weight="900" style="fill:#ef4444">⇄</text>
    <text x="500" y="366" font-size="17" font-weight="800" text-anchor="middle" style="fill:#15803d">② SET user:3 → 20 + 13 = 33B &gt; 30B</text>
    <text x="500" y="394" font-size="14" text-anchor="middle">새 키는 HEAD 바로 뒤(1등석), TAIL 바로 앞(user:1)이 퇴거 1순위!</text>
  </g>
  <!-- frame 3 -->
  <g class="f f3">
    <text x="108" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="132" y="250" width="224" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="244" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:3 "Charlie"</text>
    <text x="244" y="305" font-size="12.5" text-anchor="middle">13 bytes</text>
    <text x="366" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="390" y="250" width="224" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="502" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="502" y="305" font-size="12.5" text-anchor="middle">9 bytes</text>
    <rect x="648" y="250" width="224" height="72" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="760" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono" style="fill:#b91c1c">user:1 퇴거 중…</text>
    <text x="760" y="305" font-size="12.5" text-anchor="middle">−11 bytes, evicted_keys +1</text>
    <text x="500" y="366" font-size="17" font-weight="800" text-anchor="middle" style="fill:#b91c1c">③ 가장 오래된 user:1 꼬리 칸에서 O(1) 제거!</text>
    <text x="500" y="394" font-size="14" text-anchor="middle">used_memory ≤ maxmemory 가 될 때까지 반복</text>
  </g>
  <!-- frame 4 -->
  <g class="f f4">
    <text x="108" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="132" y="250" width="224" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="244" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:3 "Charlie"</text>
    <text x="244" y="305" font-size="12.5" text-anchor="middle">13 bytes (MRU)</text>
    <text x="366" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <rect x="390" y="250" width="224" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="502" y="280" font-size="15" font-weight="800" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="502" y="305" font-size="12.5" text-anchor="middle">9 bytes (LRU)</text>
    <text x="628" y="293" font-size="16" font-weight="900" style="fill:#10b981">⇄</text>
    <text x="500" y="366" font-size="17" font-weight="800" text-anchor="middle" style="fill:#0f766e">④ 최종 결과: used_memory:22  |  maxmemory:30  |  evicted_keys:1</text>
    <text x="500" y="394" font-size="14" text-anchor="middle">GET user:1 → (nil)   |   KEYS → "user:3", "user:2"</text>
  </g>

  <g class="dots" fill="#94a3b8"><circle cx="460" cy="440" r="4"/><circle cx="480" cy="440" r="4" style="animation-delay:.2s"/><circle cx="500" cy="440" r="4" style="animation-delay:.4s"/><circle cx="520" cy="440" r="4" style="animation-delay:.6s"/><circle cx="540" cy="440" r="4" style="animation-delay:.8s"/></g>
</svg>
