<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="LRU eviction animation">
  <style>
    text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1e293b; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .f { opacity: 0; animation: show 16s infinite; }
    .f1 { animation-delay: 0s; } .f2 { animation-delay: 4s; } .f3 { animation-delay: 8s; } .f4 { animation-delay: 12s; }
    @keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 24% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
    .bar1 { animation: b1 16s infinite; } 
    @keyframes b1 { 0%,24% { width: 200px; } 25%,49% { width: 330px; } 50%,74% { width: 220px; } 75%,100% { width: 220px; } }
    .evict { animation: ev 16s infinite; }
    @keyframes ev { 0%,49% { opacity: 1; } 55%,100% { opacity: 0; } }
    .over { animation: ov 16s infinite; }
    @keyframes ov { 0%,24% { opacity: 0; } 27%,49% { opacity: 1; } 52%,100% { opacity: 0; } }
    .dots circle { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
  <rect width="1000" height="440" rx="20" fill="#f8fafc"/>
  <text x="500" y="36" font-size="21" font-weight="800" text-anchor="middle">LRU 퇴거 시나리오 (maxmemory = 30 bytes)</text>

  <!-- memory gauge -->
  <text x="40" y="82" font-size="14" font-weight="700">메모리 게이지</text>
  <rect x="40" y="94" width="450" height="26" rx="13" fill="#e2e8f0"/>
  <rect class="bar1" x="40" y="94" width="200" height="26" rx="13" fill="#60a5fa"/>
  <!-- limit line at 30 of 33 scale: 450*30/45=300 -> x=340 -->
  <line x1="340" y1="86" x2="340" y2="128" stroke="#ef4444" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="340" y="146" font-size="12.5" font-weight="700" text-anchor="middle" style="fill:#dc2626">maxmemory 30</text>
  <text x="520" y="114" font-size="14" font-weight="700" class="over" style="fill:#dc2626">33 &gt; 30 초과! 퇴거 시작</text>

  <!-- list area -->
  <text x="40" y="190" font-size="14" font-weight="700">LRU 리스트 (왼쪽 = 최근, 오른쪽 = 오래됨)</text>
  <text x="40" y="215" font-size="12.5" class="mono">head</text>
  <text x="940" y="215" font-size="12.5" class="mono" text-anchor="end">tail</text>

  <!-- frame 1 -->
  <g class="f f1">
    <rect x="40" y="228" width="260" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="170" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="170" y="282" font-size="12.5" text-anchor="middle">9 bytes</text>
    <rect x="320" y="228" width="260" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:1 "Alice"</text>
    <text x="450" y="282" font-size="12.5" text-anchor="middle">11 bytes</text>
    <text x="500" y="340" font-size="17" font-weight="800" text-anchor="middle" style="fill:#0369a1">① SET user:1, SET user:2 → used_memory = 20</text>
    <text x="500" y="368" font-size="14" text-anchor="middle">아직 30 이하라서 아무것도 지우지 않음</text>
  </g>
  <!-- frame 2 -->
  <g class="f f2">
    <rect x="40" y="228" width="260" height="70" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="170" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:3 "Charlie"</text>
    <text x="170" y="282" font-size="12.5" text-anchor="middle">13 bytes (NEW)</text>
    <rect x="320" y="228" width="260" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="450" y="282" font-size="12.5" text-anchor="middle">9 bytes</text>
    <rect x="600" y="228" width="260" height="70" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="730" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:1 "Alice"</text>
    <text x="730" y="282" font-size="12.5" text-anchor="middle">11 bytes (LRU)</text>
    <text x="500" y="340" font-size="17" font-weight="800" text-anchor="middle" style="fill:#15803d">② SET user:3 → 20 + 13 = 33 &gt; 30</text>
    <text x="500" y="368" font-size="14" text-anchor="middle">새 키는 맨 앞(MRU), 맨 뒤(tail.prev)가 퇴거 후보</text>
  </g>
  <!-- frame 3 -->
  <g class="f f3">
    <rect x="40" y="228" width="260" height="70" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="170" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:3 "Charlie"</text>
    <text x="170" y="282" font-size="12.5" text-anchor="middle">13 bytes</text>
    <rect x="320" y="228" width="260" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="450" y="282" font-size="12.5" text-anchor="middle">9 bytes</text>
    <rect x="600" y="228" width="260" height="70" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="730" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono" style="fill:#b91c1c">user:1 삭제 중…</text>
    <text x="730" y="282" font-size="12.5" text-anchor="middle">−11 bytes, evicted_keys +1</text>
    <text x="500" y="340" font-size="17" font-weight="800" text-anchor="middle" style="fill:#b91c1c">③ 가장 오래된 user:1 퇴거 (O(1))</text>
    <text x="500" y="368" font-size="14" text-anchor="middle">used_memory ≤ maxmemory 가 될 때까지 반복</text>
  </g>
  <!-- frame 4 -->
  <g class="f f4">
    <rect x="40" y="228" width="260" height="70" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="170" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:3 "Charlie"</text>
    <text x="170" y="282" font-size="12.5" text-anchor="middle">13 bytes</text>
    <rect x="320" y="228" width="260" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="258" font-size="15" font-weight="700" text-anchor="middle" class="mono">user:2 "Bob"</text>
    <text x="450" y="282" font-size="12.5" text-anchor="middle">9 bytes</text>
    <text x="500" y="340" font-size="17" font-weight="800" text-anchor="middle" style="fill:#0f766e">④ 결과: used_memory:22  maxmemory:30  evicted_keys:1</text>
    <text x="500" y="368" font-size="14" text-anchor="middle">GET user:1 → (nil)   |   KEYS → "user:3", "user:2"</text>
  </g>

  <g class="dots" fill="#94a3b8"><circle cx="460" cy="412" r="4"/><circle cx="480" cy="412" r="4" style="animation-delay:.2s"/><circle cx="500" cy="412" r="4" style="animation-delay:.4s"/><circle cx="520" cy="412" r="4" style="animation-delay:.6s"/><circle cx="540" cy="412" r="4" style="animation-delay:.8s"/></g>
</svg>
