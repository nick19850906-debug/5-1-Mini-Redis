<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="TTL min heap animation">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1e293b; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .root { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: shrink 8s linear infinite; }
    .b2 { animation-duration: 20s; } .b3 { animation-duration: 12s; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.13); } }
    @keyframes shrink { 0% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .peek { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .root, .bar, .peek { animation: none !important; } }
  </style>
  <rect width="1000" height="410" rx="20" fill="#f8fafc"/>
  <text x="500" y="34" font-size="21" font-weight="800" text-anchor="middle">최소 힙이 TTL에 딱 맞는 이유: 가장 급한 키가 항상 0번 꼭대기</text>

  <!-- 2D tree -->
  <g stroke="#cbd5e1" stroke-width="2.5">
    <line x1="250" y1="108" x2="160" y2="188"/><line x1="250" y1="108" x2="340" y2="188"/>
    <line x1="160" y1="216" x2="110" y2="278"/><line x1="160" y1="216" x2="210" y2="278"/>
  </g>
  <g class="mono" font-size="13" text-anchor="middle">
    <g class="root"><circle cx="250" cy="94" r="30" fill="#fbbf24" stroke="#d97706" stroke-width="3"/><text x="250" y="90" font-weight="800">3초</text><text x="250" y="106" font-size="10.5">[0] u2</text></g>
    <circle cx="160" cy="198" r="27" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><text x="160" y="194" font-weight="700">8초</text><text x="160" y="210" font-size="10.5">[1] u9</text>
    <circle cx="340" cy="198" r="27" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><text x="340" y="194" font-weight="700">5초</text><text x="340" y="210" font-size="10.5">[2] u4</text>
    <circle cx="110" cy="284" r="24" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="110" y="280" font-weight="700">12초</text><text x="110" y="295" font-size="10">[3] u7</text>
    <circle cx="210" cy="284" r="24" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="210" y="280" font-weight="700">9초</text><text x="210" y="295" font-size="10">[4] u1</text>
  </g>
  <text x="296" y="72" font-size="13" font-weight="800" class="peek" style="fill:#b45309">◀ peek() = O(1)</text>
  <text x="42" y="136" font-size="12.5" style="fill:#64748b">규칙: 부모 ≤ 자식</text>

  <!-- 1D Array Mapping directly underneath tree -->
  <text x="40" y="346" font-size="13" font-weight="800" style="fill:#b45309">1차원 배열 _data[ ] 실제 저장 모습 (인덱스 공식: 왼쪽 자식 = 2i+1, 오른쪽 자식 = 2i+2)</text>
  <g class="mono" font-size="12" text-anchor="middle">
    <rect x="40" y="358" width="90" height="34" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="85" y="379" font-weight="800">[0] 3초</text>
    <rect x="138" y="358" width="90" height="34" rx="8" fill="#fff" stroke="#f59e0b"/><text x="183" y="379">[1] 8초</text>
    <rect x="236" y="358" width="90" height="34" rx="8" fill="#fff" stroke="#f59e0b"/><text x="281" y="379">[2] 5초</text>
    <rect x="334" y="358" width="90" height="34" rx="8" fill="#fff" stroke="#f59e0b"/><text x="379" y="379">[3] 12초</text>
    <rect x="432" y="358" width="90" height="34" rx="8" fill="#fff" stroke="#f59e0b"/><text x="477" y="379">[4] 9초</text>
  </g>

  <!-- countdown bars -->
  <text x="540" y="84" font-size="15" font-weight="800">만료까지 남은 시간 (실시간 카운트다운)</text>
  <g class="mono" font-size="13">
    <text x="540" y="124">user:2</text><rect x="615" y="108" width="335" height="22" rx="11" fill="#fde68a"/><rect class="bar" x="615" y="108" width="335" height="22" rx="11" fill="#f59e0b"/>
    <text x="540" y="164">user:4</text><rect x="615" y="148" width="335" height="22" rx="11" fill="#fde68a"/><rect class="bar b3" x="615" y="148" width="335" height="22" rx="11" fill="#fbbf24"/>
    <text x="540" y="204">user:9</text><rect x="615" y="188" width="335" height="22" rx="11" fill="#fde68a"/><rect class="bar b2" x="615" y="188" width="335" height="22" rx="11" fill="#fcd34d"/>
  </g>

  <!-- cost table -->
  <rect x="540" y="236" width="410" height="106" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="560" y="262" font-size="14" font-weight="800" style="fill:#9a3412">성능 비교 &amp; 게으른 삭제 (Lazy Deletion)</text>
  <text x="560" y="286" font-size="13">• 전체 스캔: 매번 O(N) ❌  |  최소 힙: peek O(1) · pop O(log N) ✅</text>
  <text x="560" y="310" font-size="12.5" style="fill:#78350f">• _heapify_up / _heapify_down 으로 항상 최솟값이 [0]번 유지</text>
  <text x="560" y="330" font-size="12.5" style="fill:#78350f">• 무효화된 옛 TTL 은 pop 시 Record.expire_at 대조 후 폐기</text>
</svg>
