<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="TTL min heap animation">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1e293b; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .root { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: shrink 8s linear infinite; }
    .b2 { animation-duration: 20s; } .b3 { animation-duration: 12s; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @keyframes shrink { 0% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .peek { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  </style>
  <rect width="1000" height="360" rx="20" fill="#f8fafc"/>
  <text x="500" y="36" font-size="21" font-weight="800" text-anchor="middle">최소 힙이 TTL에 딱 맞는 이유: 가장 급한 키가 항상 맨 위</text>

  <!-- tree -->
  <g stroke="#cbd5e1" stroke-width="2.5">
    <line x1="250" y1="112" x2="160" y2="196"/><line x1="250" y1="112" x2="340" y2="196"/>
    <line x1="160" y1="226" x2="110" y2="290"/><line x1="160" y1="226" x2="210" y2="290"/>
  </g>
  <g class="mono" font-size="13" text-anchor="middle">
    <g class="root"><circle cx="250" cy="96" r="30" fill="#fbbf24" stroke="#d97706" stroke-width="3"/><text x="250" y="93" font-weight="700">3초</text><text x="250" y="109" font-size="11">user:2</text></g>
    <circle cx="160" cy="210" r="28" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><text x="160" y="207" font-weight="700">8초</text><text x="160" y="223" font-size="11">user:9</text>
    <circle cx="340" cy="210" r="28" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><text x="340" y="207" font-weight="700">5초</text><text x="340" y="223" font-size="11">user:4</text>
    <circle cx="110" cy="302" r="24" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="110" y="299" font-weight="700">12초</text><text x="110" y="314" font-size="10">user:7</text>
    <circle cx="210" cy="302" r="24" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="210" y="299" font-weight="700">9초</text><text x="210" y="314" font-size="10">user:1</text>
  </g>
  <text x="298" y="70" font-size="13" font-weight="700" class="peek" style="fill:#b45309">peek() = O(1)</text>
  <text x="42" y="142" font-size="12.5" style="fill:#64748b">부모 ≤ 자식 (항상)</text>

  <!-- countdown bars -->
  <text x="520" y="84" font-size="15" font-weight="800">만료까지 남은 시간 (실시간 카운트다운)</text>
  <g class="mono" font-size="13">
    <text x="520" y="124">user:2</text><rect x="600" y="108" width="340" height="22" rx="11" fill="#fde68a"/><rect class="bar" x="600" y="108" width="340" height="22" rx="11" fill="#f59e0b"/>
    <text x="520" y="164">user:4</text><rect x="600" y="148" width="340" height="22" rx="11" fill="#fde68a"/><rect class="bar b3" x="600" y="148" width="340" height="22" rx="11" fill="#fbbf24"/>
    <text x="520" y="204">user:9</text><rect x="600" y="188" width="340" height="22" rx="11" fill="#fde68a"/><rect class="bar b2" x="600" y="188" width="340" height="22" rx="11" fill="#fcd34d"/>
  </g>

  <!-- cost table -->
  <rect x="520" y="238" width="420" height="96" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="540" y="266" font-size="14" font-weight="700">비용 비교</text>
  <text x="540" y="292" font-size="13.5">전체 스캔: 매번 O(N)  ❌</text>
  <text x="540" y="316" font-size="13.5">최소 힙: peek O(1) · push/pop O(log N)  ✅</text>
</svg>
