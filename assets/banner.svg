<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Mini Redis banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.55" stop-color="#2b4c7e"/>
      <stop offset="1" stop-color="#3b6ea5"/>
    </linearGradient>
    <linearGradient id="chipA" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="chipB" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="chipC" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .float1 { animation: f1 6s ease-in-out infinite; }
    .float2 { animation: f2 7.5s ease-in-out infinite; }
    .float3 { animation: f3 9s ease-in-out infinite; }
    .chip { animation: pop 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .c2 { animation-delay: .5s; } .c3 { animation-delay: 1s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes f1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes f2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
    @keyframes f3 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <circle class="float1" cx="880" cy="60" r="46" fill="#ffffff" opacity="0.07"/>
  <circle class="float2" cx="940" cy="190" r="30" fill="#ffffff" opacity="0.08"/>
  <circle class="float3" cx="640" cy="215" r="22" fill="#ffffff" opacity="0.06"/>
  <circle class="float2" cx="70" cy="215" r="34" fill="#ffffff" opacity="0.06"/>
  <rect x="62" y="28" width="166" height="26" rx="13" fill="#0f172a" opacity="0.45"/>
  <text x="62" y="46" font-size="13" font-weight="700" fill="#93c5fd" text-anchor="middle" dx="83">5-1- Mini Redis</text>
  <text x="60" y="108" font-size="56" font-weight="800" fill="#ffffff">Mini Redis</text>
  <text x="62" y="148" font-size="21" fill="#dbeafe">밑바닥부터 만든 CLI 인메모리 Key-Value 저장소</text>
  <text x="62" y="176" font-size="15.5" fill="#bfdbfe">dict · set · collections 없이 — 해시맵 · 이중 연결 리스트 · 최소 힙</text>
  <g class="chip">
    <rect x="62" y="196" width="190" height="36" rx="18" fill="url(#chipA)"/>
    <text x="157" y="220" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">HashMap</text>
  </g>
  <g class="chip c2">
    <rect x="266" y="196" width="250" height="36" rx="18" fill="url(#chipB)"/>
    <text x="391" y="220" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">DoublyLinkedList (LRU)</text>
  </g>
  <g class="chip c3">
    <rect x="530" y="196" width="190" height="36" rx="18" fill="url(#chipC)"/>
    <text x="625" y="220" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">MinHeap (TTL)</text>
  </g>
  <rect x="595" y="44" width="365" height="104" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.88"/>
  <circle cx="617" cy="62" r="5" fill="#ef4444"/><circle cx="633" cy="62" r="5" fill="#fbbf24"/><circle cx="649" cy="62" r="5" fill="#22c55e"/>
  <text x="615" y="96" font-size="16" fill="#93c5fd" font-family="Consolas, monospace">mini-redis&gt; SET hello "world"</text>
  <text x="615" y="124" font-size="16" fill="#86efac" font-family="Consolas, monospace">OK<tspan class="cursor" fill="#fff"> ▌</tspan></text>
</svg>
